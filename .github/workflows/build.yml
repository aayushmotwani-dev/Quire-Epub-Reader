# Builds Quire for Windows, macOS, Android and iPhone on GitHub's own machines.
# Run it from the Actions tab ("Run workflow"), then download the files under "Artifacts".
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Quire-Windows
          path: dist/Quire-Setup-*.exe
          if-no-files-found: error

  mac:
    # Intel Mac. GitHub's Apple-silicon Macs are often full ("capacity constraints").
    # It still builds both the Apple-silicon (arm64) and Intel (x64) versions.
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Quire-macOS
          path: dist/*.dmg
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # The runner already has the Android SDK. An empty "packages" skips the extra
      # sdkmanager install that failed with "Failed to find package 'tools'".
      - uses: android-actions/setup-android@v3
        with: { packages: '' }
      - run: npm ci
      - run: npx cap sync android
      - name: Build debug APK (signed with a debug key, installs directly)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Quire.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Quire-Android
          path: Quire.apk
          if-no-files-found: error

  ios:
    # Capacitor 8 needs Xcode 26; this Intel image defaults to Xcode 26.6.
    # The Intel Mac also avoids the queue on the Apple-silicon ones.
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx cap sync ios
      - run: xcodebuild -version
      - name: Build unsigned app (your sideload tool signs it with your Apple ID)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package .ipa
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/ios/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Quire.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Quire-iPhone
          path: Quire.ipa
          if-no-files-found: error
